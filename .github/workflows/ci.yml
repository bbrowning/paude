name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-22.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
      containers: ${{ steps.filter.outputs.containers }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'Makefile'
              - '.github/workflows/**'
            containers:
              - 'containers/**'

  lint:
    name: Lint & Type Check
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Run linter
        run: make lint

      - name: Run type checker
        run: make typecheck

  unit-tests:
    name: Unit Tests
    needs: [detect-changes, lint]
    if: needs.detect-changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: make test

  podman-integration:
    name: Podman Integration Tests
    needs: [detect-changes, lint, unit-tests]
    if: always() && !failure() && !cancelled() && (needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.containers == 'true')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Verify Podman
        run: |
          podman version
          podman info
          podman_version="$(podman version --format '{{.Client.Version}}')"
          podman_major="${podman_version%%.*}"
          if ! [[ "$podman_major" =~ ^[0-9]+$ ]] || (( podman_major < 4 )); then
            echo "Podman 4.0+ is required; found ${podman_version:-unknown}" >&2
            exit 1
          fi

      - name: Build test images
        run: make build

      - name: Run Podman integration tests
        run: make test-podman
